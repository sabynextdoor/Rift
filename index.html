<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rift by Saby — Send files. Share a link. Done. Secure, fast file transfers with expiring links, password protection, and download limits." />
    <meta name="author" content="Saby" />
    <meta name="theme-color" content="#030308" />
    <title>Rift by Saby — Send files. Share a link. Done.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      /* Prevent flash of wrong theme */
      :root {
        color-scheme: dark light;
      }
      
      body { 
        background: #050505; 
        margin: 0;
        transition: background-color 0.3s ease;
      }
      
      [data-theme="light"] body {
        background: #FFFFFF;
      }
      
      #root { min-height: 100vh; }
      
      /* Initial theme detection */
      @media (prefers-color-scheme: light) {
        :root:not([data-theme]) body {
          background: #FFFFFF;
        }
      }
    </style>
    <script>
      // Set initial theme before React loads
      (function() {
        const saved = localStorage.getItem('rift-theme');
        if (saved) {
          document.documentElement.setAttribute('data-theme', saved);
        } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
